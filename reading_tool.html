<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Careful Reading - A4纵向精准导出版</title>
    <style>
        /* ================= 核心变量与纸张定义 ================= */
        :root {
            --text-main: #222222;
            --signpost-red: #c62828; 
            --bg-paper: #fcfcf9; 
            --a4-width: 210mm; /* A4 纵向宽度 */
        }

        /* ================= 打印控制 (解决PDF乱码与掉色) ================= */
        @media print {
            body { background: none !important; padding: 0 !important; margin: 0 !important; }
            .control-panel { display: none !important; }
            .preview-container { 
                box-shadow: none !important; 
                width: var(--a4-width) !important; 
                margin: 0 !important; 
                padding: 10mm 12mm !important; /* 打印边距 */
            }
            * { 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
                color-adjust: exact !important;
            }
            @page { 
                size: A4 portrait; 
                margin: 0; /* 由容器padding控制 */
            }
            .paragraph-row, .vocab-card, .question-item { 
                page-break-inside: avoid !important; /* 防止内容被切断 */
            }
        }

        /* ================= 基础样式 ================= */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef0f4; margin: 0; padding: 20px; }
        .control-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; max-width: var(--a4-width); margin-left: auto; margin-right: auto; }
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea { width: 100%; height: 140px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; font-family: monospace;}
        button { background: #333; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s;}
        button:hover { background: #555; }
        .btn-green { background: #4a7c59; }

        /* ================= A4 预览容器 ================= */
        .preview-container {
            background: var(--bg-paper); 
            width: var(--a4-width); 
            min-height: 297mm; /* A4 纵向高度 */
            margin: 0 auto;
            padding: 15mm 15mm;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            position: relative;
        }

        /* ----- 头部 ----- */
        .page-header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;}
        .main-title { font-size: 32px; font-family: 'Arial Black', sans-serif; color: #222; text-transform: uppercase; line-height: 1;}
        .main-title span { color: #888; }
        .sub-title { font-size: 12px; font-weight: bold; color: #666; text-transform: uppercase; letter-spacing: 1px;}

        /* ================= 纵向两栏布局优化 ================= */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 190px; /* 纵向模式下缩小词汇栏宽度 */
            gap: 20px;
            align-items: start;
        }

        .article-section { display: flex; flex-direction: column; gap: 25px; }
        
        /* 段落行布局 */
        .paragraph-row { display: grid; grid-template-columns: 90px 1fr; gap: 15px; align-items: start; margin-bottom: 5px;}

        /* 引路栏 */
        .guide-box {
            font-size: 12px; color: #555; line-height: 1.5; padding-right: 12px; 
            border-right: 2px solid #ddd; text-align: right; font-weight: 600;
        }
        .guide-title { font-weight: 900; color: #999; font-size: 10px; margin-bottom: 4px; text-transform: uppercase;}

        /* 正文区 */
        .para-block { display: flex; align-items: flex-start; gap: 8px; }
        .para-num { font-family: 'Arial Black', sans-serif; font-size: 16px; color: #999; margin-top: 4px; flex-shrink: 0;}
        .para-text { flex: 1; font-family: 'Times New Roman', serif; font-size: 16px; line-height: 1.8; color: var(--text-main); text-align: justify;}

        /* 强调标记 */
        .signpost-word { color: var(--signpost-red); font-weight: 900; font-size: 1.1em; }
        .vocab-hl { padding: 1px 3px; font-weight: bold; border-radius: 2px; }
        .evidence-line { border-bottom: 1.5px dashed #777; padding-bottom: 1px; }
        .evidence-tag { font-family: Arial; font-size: 9px; font-weight: bold; color: #666; vertical-align: super; background: #eee; padding: 0 2px; }

        /* ================= 右侧词汇无缝块 (纵向优化) ================= */
        .right-vocab-area { 
            display: flex; flex-direction: column; 
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 4px; overflow: hidden;
        }
        .vocab-card { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.3); }
        .vocab-card:last-child { border-bottom: none; }
        .vocab-head { font-weight: 900; font-size: 14px; margin-bottom: 4px; display: flex; flex-direction: column; }
        .vocab-phonetic { font-size: 11px; font-weight: normal; opacity: 0.8; margin-top: 2px;}
        .vocab-body { font-size: 12.5px; line-height: 1.5; }
        .vocab-meaning { font-weight: bold; margin-bottom: 4px; display: block; }
        .vocab-example-en { font-style: italic; margin-top: 4px; font-size: 12px; opacity: 0.9; }
        .vocab-example-cn { font-size: 11px; opacity: 0.8; margin-bottom: 4px;}
        .vocab-expansion { font-size: 11.5px; margin-top: 6px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 6px;}

        /* 题目区 */
        .questions-section { border-top: 2px solid #444; padding-top: 15px; margin-top: 25px; grid-column: 1 / -1; }
        .q-header { font-family: 'Arial Black', sans-serif; font-size: 14px; margin-bottom: 12px; text-transform: uppercase;}
        .question-item { margin-bottom: 12px; font-family: Arial, sans-serif; font-size: 13.5px; }
        .question-stem { font-weight: bold; margin-bottom: 5px; }
        .q-option { margin-left: 10px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3 style="margin-top:0;">📄 A4纵向排版系统 (导出不乱码版)</h3>
        <div class="grid-2col">
            <div>
                <label>1. 原文与题目</label>
                <textarea id="rawText" placeholder="粘贴原文..."></textarea>
                <button onclick="generatePrompt()">生成提示词</button>
            </div>
            <div>
                <label>2. 复制提示词到豆包</label>
                <textarea id="promptArea" readonly></textarea>
                <button onclick="copyPrompt()">复制</button>
            </div>
        </div>
        <div style="margin-top:15px;">
            <label>3. 粘贴 JSON 结果</label>
            <textarea id="jsonInput" style="height:80px;"></textarea>
            <button class="btn-green" onclick="renderLayout()">✨ 渲染排版</button>
            <button onclick="window.print()" style="background:#c62828;">🖨️ 导出 PDF</button>
        </div>
    </div>

    <div class="preview-container" id="previewArea">
        <div class="page-header">
            <div class="main-title">READING <span>EXPLORER</span></div>
            <div class="sub-title">Intensive Study | Portrait A4</div>
        </div>

        <div class="main-layout">
            <div class="article-section" id="articleContent">
                </div>
            <div class="right-vocab-area" id="vocabContent">
                </div>
        </div>

        <div class="questions-section">
            <div class="q-header">Comprehension & Analysis</div>
            <div id="questionsContent"></div>
        </div>
    </div>

    <script>
        const themes = [
            { bg: '#eef2ef', head: '#2a4b32' }, // 灰绿
            { bg: '#f5efea', head: '#6b3c1a' }, // 奶茶
            { bg: '#edf1f5', head: '#2d445c' }, // 灰蓝
            { bg: '#f5f0f2', head: '#6a2a43' }, // 藕粉
            { bg: '#f4f4e8', head: '#57553b' }  // 浅卡其
        ];

        function generatePrompt() {
            const rawText = document.getElementById('rawText').value.trim();
            const prompt = `你是一位英语教研专家。请分析以下原文和题目，按JSON输出。

# 规则：
1. 每一段提取2个路标词。左侧提问(structure_q)严禁出现英文原词。原文标记：【路标:word】。
2. 精读词组(vocabulary)：全文严格限制在4-6个最重要考点，每段不超过2个。原文标记：【词组ID:phrase】。不要给中文。
3. 题目溯源：精准找到原句，标记：【Q1-A开始】原句【Q1-A结束】。必须一字不差。
4. 原文text中绝对不允许出现任何中文。

# 结构：
{
  "content_blocks": [{"para_num":"①","structure_q":"提问","text":"内容"}],
  "vocabulary": [{"id":1,"phrase":"词组","phonetic":"音标","meaning":"释义","example_en":"例句","example_cn":"翻译","expansion":"拓展"}],
  "questions": [{"q_num":1,"question":"题干","options":["A.xx"]}]
}

待处理内容：
${rawText}`;
            document.getElementById('promptArea').value = prompt;
        }

        function copyPrompt() {
            document.getElementById('promptArea').select();
            document.execCommand('copy');
            alert("提示词已复制！");
        }

        function renderLayout() {
            const jsonStr = document.getElementById('jsonInput').value.trim();
            let data;
            try {
                data = JSON.parse(jsonStr.replace(/```json|```/gi, '').trim());
            } catch (e) { alert("JSON解析失败"); return; }

            let themeMap = {};
            let vocabHTML = '';
            data.vocabulary.forEach((v, i) => {
                const theme = themes[i % themes.length];
                themeMap[v.id] = theme;
                vocabHTML += `
                <div class="vocab-card" style="background:${theme.bg};">
                    <div class="vocab-head" style="color:${theme.head};">${v.phrase} <span class="vocab-phonetic">${v.phonetic}</span></div>
                    <div class="vocab-body">
                        <span class="vocab-meaning" style="color:${theme.head}">${v.meaning}</span>
                        <div class="vocab-example-en">${v.example_en}</div>
                        <div class="vocab-example-cn">${v.example_cn}</div>
                        ${v.expansion ? `<div class="vocab-expansion">${v.expansion}</div>` : ''}
                    </div>
                </div>`;
            });
            document.getElementById('vocabContent').innerHTML = vocabHTML;

            let articleHTML = '';
            data.content_blocks.forEach(block => {
                let txt = block.text;
                txt = txt.replace(/【路标:(.*?)】/gi, '<span class="signpost-word">$1</span>');
                txt = txt.replace(/【词组(\d+):(.*?)】/gi, (m, id, eng) => {
                    const t = themeMap[id] || {bg:'#eee', head:'#333'};
                    return `<span class="vocab-hl" style="background:${t.bg}; color:${t.head}">${eng}</span>`;
                });
                txt = txt.replace(/【(Q\d+(?:-[A-Z])?)开始】(.*?)【\1结束】/gi, '<span class="evidence-line">$2<span class="evidence-tag">$1</span></span>');

                articleHTML += `
                <div class="paragraph-row">
                    <div class="guide-box">
                        <div class="guide-title">PARAGRAPH ${block.para_num}</div>
                        ${block.structure_q}
                    </div>
                    <div class="para-block">
                        <div class="para-num">${block.para_num}</div>
                        <div class="para-text">${txt}</div>
                    </div>
                </div>`;
            });
            document.getElementById('articleContent').innerHTML = articleHTML;

            let qHTML = '';
            data.questions.forEach(q => {
                qHTML += `<div class="question-item"><div class="question-stem">${q.q_num}. ${q.question}</div>`;
                q.options.forEach(opt => qHTML += `<div class="q-option">${opt}</div>`);
                qHTML += `</div>`;
            });
            document.getElementById('questionsContent').innerHTML = qHTML;
        }
    </script>
</body>
</html>
