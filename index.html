<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>积分工具 - 智能排版系统</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e6edf4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            padding: 2rem 1.8rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.5);
        }
        h2 {
            font-size: 1.7rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1a2c3e;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-left: 5px solid #3b82f6;
            padding-left: 1rem;
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: #2c3e4e;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 1.2rem;
            background: white;
            transition: 0.2s;
            outline: none;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        button {
            background: #1e293b;
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 2rem;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        button:active { transform: scale(0.97); }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }
        .tool-btn {
            background: #3b82f6;
            margin-top: 0.8rem;
        }
        .logout-btn {
            background: #475569;
            margin-top: 1rem;
        }
        .message-area {
            margin-top: 1.2rem;
            padding: 0.75rem;
            border-radius: 1.2rem;
            font-size: 0.85rem;
            background: #f8fafc;
            border-left: 4px solid #94a3b8;
            color: #1e293b;
            word-break: break-word;
        }
        .error-msg {
            background: #fee2e2;
            border-left-color: #dc2626;
            color: #7f1a1a;
        }
        .success-msg {
            background: #e0f2fe;
            border-left-color: #0284c7;
        }
        .warning-msg {
            background: #fff3cd;
            border-left-color: #f59e0b;
        }
        .credit-badge {
            background: #0f172a;
            color: #facc15;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            font-weight: bold;
            display: inline-block;
            font-size: 1rem;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        hr {
            margin: 1.2rem 0;
            border: none;
            height: 1px;
            background: #e2e8f0;
        }
        .small-note {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1.2rem;
            color: #5b6e8c;
        }
    </style>
</head>
<body>
<div id="appRoot">
    <!-- 登录区域 -->
    <div id="loginArea" class="card">
        <h2>🔐 积分工具 · 登录</h2>
        <div class="input-group">
            <label>📛 账号</label>
            <input id="username" type="text" placeholder="请输入管理员分配的账号" autocomplete="off">
        </div>
        <div class="input-group">
            <label>🔒 密码</label>
            <input id="password" type="password" placeholder="请输入密码" autocomplete="off">
        </div>
        <button id="loginBtn" onclick="login()">登录系统</button>
        <div id="message" class="message-area">✨ 输入账号密码，使用积分工具</div>
        <div class="small-note">⚡ 每次使用工具消耗1积分，自动打开排版神器 | 积分不足请联系管理员</div>
    </div>

    <!-- 工具使用区域 -->
    <div id="toolArea" class="card" style="display:none;">
        <div class="flex-between">
            <h2 style="margin-bottom:0;">🛠️ 智能工具箱</h2>
            <span class="credit-badge" id="creditsLeft">0</span>
        </div>
        <p>欢迎，<strong id="displayUser"></strong>  👋</p>
        <p style="background:#f1f5f9; padding: 0.6rem; border-radius: 1rem; text-align:center;">
            💎 剩余积分：<span id="creditsLeftInner" style="font-size:1.4rem; font-weight:800; color:#0f3b5c;">0</span>
        </p>
        <button class="tool-btn" onclick="useTool()">⚙️ 使用一次工具（消耗1积分）</button>
        <button class="logout-btn" onclick="logout()">🚪 退出登录</button>
        <div id="toolMsg" class="message-area">✅ 就绪，点击按钮将打开排版神器</div>
    </div>
</div>

<script>
    // ======================== SUPABASE 配置 ========================
    const SUPABASE_URL = 'https://dmiylurcdvqlhadjwqqp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtaXlsdXJjZHZxbGhhZGp3cXFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MTQ4NTksImV4cCI6MjA5MzE5MDg1OX0.7IiJhHGIK7UdgXA4_NHLRY78PC2JiSuMR_KNNqvyjm4';
    
    let supabaseClient = null;
    let currentUser = null;

    // ---------- 初始化 Supabase 客户端 ----------
    function initSupabaseClient() {
        try {
            if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                throw new Error('Supabase SDK 加载失败，请刷新页面重试。');
            }
            if (!SUPABASE_URL || !SUPABASE_KEY || SUPABASE_URL.length < 10 || SUPABASE_KEY.length < 10) {
                throw new Error('Supabase 配置错误：URL 或 KEY 无效，请联系管理员。');
            }
            const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log('[Supabase] 客户端初始化成功');
            return client;
        } catch (err) {
            console.error('[Supabase] 初始化错误:', err);
            const msgDiv = document.getElementById('message');
            if (msgDiv) {
                msgDiv.innerHTML = `💥 系统初始化失败: ${err.message}<br>请刷新页面或检查网络/Supabase服务状态。`;
                msgDiv.classList.add('error-msg');
            }
            throw err;
        }
    }

    function getSupabase() {
        if (!supabaseClient) {
            supabaseClient = initSupabaseClient();
        }
        return supabaseClient;
    }

    // ---------- 登录函数（完整错误处理）----------
    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');
        
        if (!username || !password) {
            messageDiv.innerHTML = '⚠️ 请完整填写账号和密码';
            messageDiv.classList.add('warning-msg');
            messageDiv.classList.remove('error-msg', 'success-msg');
            return;
        }

        const originalText = loginBtn.innerText;
        loginBtn.disabled = true;
        loginBtn.innerText = '⏳ 验证中...';
        messageDiv.innerHTML = '🔍 正在连接服务器，请稍候...';
        messageDiv.classList.remove('error-msg', 'success-msg', 'warning-msg');
        messageDiv.classList.add('warning-msg');

        try {
            const supabase = getSupabase();
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .maybeSingle();
            
            if (error) {
                console.error('[登录错误]', error);
                let friendlyMsg = '';
                if (error.message.includes('relation') && error.message.includes('does not exist')) {
                    friendlyMsg = '❌ 数据库表 "users" 不存在，请先在 Supabase 中创建表。';
                } else if (error.message.includes('permission') || error.message.includes('policy')) {
                    friendlyMsg = '🔐 权限不足：请检查 Supabase RLS 策略，确保 anon key 可读取 users 表。';
                } else if (error.message.includes('Failed to fetch')) {
                    friendlyMsg = '🌐 网络连接失败：无法访问 Supabase 服务器，请检查网络或防火墙。';
                } else {
                    friendlyMsg = `📡 数据库请求异常: ${error.message}`;
                }
                throw new Error(friendlyMsg);
            }
            
            if (!data) {
                messageDiv.innerHTML = '❌ 账号或密码错误，请重新输入。';
                messageDiv.classList.add('error-msg');
                messageDiv.classList.remove('warning-msg', 'success-msg');
                loginBtn.disabled = false;
                loginBtn.innerText = originalText;
                return;
            }
            
            if (data.credits === undefined || data.credits <= 0) {
                messageDiv.innerHTML = '⚠️ 您的积分已用完，请联系管理员充值后再使用。';
                messageDiv.classList.add('error-msg');
                loginBtn.disabled = false;
                loginBtn.innerText = originalText;
                return;
            }
            
            // 登录成功
            currentUser = data;
            document.getElementById('displayUser').innerText = currentUser.username;
            const creditsVal = currentUser.credits;
            document.getElementById('creditsLeft').innerText = creditsVal;
            document.getElementById('creditsLeftInner').innerText = creditsVal;
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('toolArea').style.display = 'block';
            document.getElementById('toolMsg').innerHTML = '✅ 登录成功！点击按钮即可使用排版神器（每次消耗1积分）。';
            document.getElementById('toolMsg').classList.add('success-msg');
            document.getElementById('toolMsg').classList.remove('error-msg', 'warning-msg');
            
        } catch (err) {
            messageDiv.innerHTML = `⚠️ 登录失败: ${err.message}`;
            messageDiv.classList.add('error-msg');
        } finally {
            if (document.getElementById('loginArea').style.display !== 'none') {
                loginBtn.disabled = false;
                loginBtn.innerText = originalText;
            }
        }
    }

    // ---------- 使用工具（消耗积分 + 打开排版神器）----------
    async function useTool() {
        if (!currentUser) {
            logout();
            return;
        }
        
        const toolMsgDiv = document.getElementById('toolMsg');
        const useBtn = document.querySelector('.tool-btn');
        const originalText = useBtn ? useBtn.innerText : '';
        if (useBtn) {
            useBtn.disabled = true;
            useBtn.innerText = '⏳ 处理中...';
        }
        
        toolMsgDiv.innerHTML = '🔄 正在验证积分，请稍候...';
        toolMsgDiv.classList.add('warning-msg');
        toolMsgDiv.classList.remove('error-msg', 'success-msg');
        
        try {
            const supabase = getSupabase();
            // 获取最新积分
            const { data: freshUser, error: fetchError } = await supabase
                .from('users')
                .select('credits, id')
                .eq('id', currentUser.id)
                .maybeSingle();
                
            if (fetchError) {
                let netErrMsg = fetchError.message || '未知网络错误';
                if (netErrMsg.includes('Failed to fetch')) {
                    netErrMsg = '🌐 网络连接断开，请检查网络后重试。';
                } else if (netErrMsg.includes('permission')) {
                    netErrMsg = '🔒 权限验证失败，请重新登录。';
                }
                throw new Error(`查询积分失败: ${netErrMsg}`);
            }
            
            if (!freshUser || freshUser.credits <= 0) {
                toolMsgDiv.innerHTML = '❌ 积分不足，请联系管理员充值。即将返回登录页...';
                toolMsgDiv.classList.add('error-msg');
                setTimeout(() => logout(), 1800);
                if (useBtn) { useBtn.disabled = false; useBtn.innerText = originalText; }
                return;
            }
            
            // 扣除1积分
            const newCredits = freshUser.credits - 1;
            const { error: updateError } = await supabase
                .from('users')
                .update({ credits: newCredits })
                .eq('id', currentUser.id);
                
            if (updateError) {
                throw new Error(`操作失败: ${updateError.message}`);
            }
            
            // 更新本地状态和界面
            currentUser.credits = newCredits;
            document.getElementById('creditsLeft').innerText = newCredits;
            document.getElementById('creditsLeftInner').innerText = newCredits;
            toolMsgDiv.innerHTML = `✅ 使用成功！消耗1积分，剩余 ${newCredits} 积分。正在打开排版神器...`;
            toolMsgDiv.classList.add('success-msg');
            toolMsgDiv.classList.remove('error-msg', 'warning-msg');
            
            // 🎯 核心功能：扣分成功后打开排版神器 HTML
            window.open('阅读讲解单制作排版神器.html', '_blank');
            
            if (newCredits <= 0) {
                toolMsgDiv.innerHTML += '<br>💡 积分已用完，将自动退出登录。';
                setTimeout(() => logout(), 2500);
            }
            
        } catch (err) {
            console.error('[useTool 异常]', err);
            toolMsgDiv.innerHTML = `⚠️ 工具使用异常: ${err.message || '请刷新页面或检查网络'}<br>未消耗积分，请稍后重试。`;
            toolMsgDiv.classList.add('error-msg');
        } finally {
            if (useBtn) {
                useBtn.disabled = false;
                useBtn.innerText = originalText || '使用一次工具（消耗1积分）';
            }
        }
    }
    
    // 退出登录
    function logout() {
        currentUser = null;
        document.getElementById('loginArea').style.display = 'block';
        document.getElementById('toolArea').style.display = 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        const msgDiv = document.getElementById('message');
        if (msgDiv) {
            msgDiv.innerHTML = '✨ 已退出登录，可重新输入账号密码。';
            msgDiv.classList.remove('error-msg', 'warning-msg', 'success-msg');
            msgDiv.classList.add('warning-msg');
        }
        const toolMsg = document.getElementById('toolMsg');
        if (toolMsg) {
            toolMsg.innerHTML = '🚪 已退出，如需使用请重新登录。';
            toolMsg.classList.add('warning-msg');
        }
        // 恢复按钮状态
        const loginBtn = document.getElementById('loginBtn');
        if (loginBtn) loginBtn.disabled = false;
        const useBtn = document.querySelector('.tool-btn');
        if (useBtn) useBtn.disabled = false;
    }

    // 页面启动预检连通性
    async function preflightConnection() {
        try {
            const supabase = getSupabase();
            if (!supabase) throw new Error('客户端未就绪');
            const { error } = await supabase
                .from('users')
                .select('id', { count: 'exact', head: true })
                .limit(1);
            if (error) {
                if (error.message.includes('relation') && error.message.includes('does not exist')) {
                    displayStartupWarning('⚠️ 数据库表 "users" 未找到，请在Supabase中创建users表。');
                } else if (error.message.includes('permission')) {
                    displayStartupWarning('🔐 警告: 无法访问 users 表，可能缺少RLS策略。登录可能失败。');
                } else if (error.message.includes('Failed to fetch')) {
                    displayStartupWarning('🌐 预检连接失败: 无法访问Supabase后端，请检查网络。');
                }
            } else {
                console.log('[预检] 连接正常');
                const msgDiv = document.getElementById('message');
                if (msgDiv && !msgDiv.innerHTML.includes('失败')) {
                    msgDiv.innerHTML = '✅ 数据库连接正常，请输入账号密码登录。';
                    msgDiv.classList.add('success-msg');
                    setTimeout(() => {
                        if (msgDiv && msgDiv.innerHTML.includes('数据库连接正常')) {
                            msgDiv.innerHTML = '✨ 输入账号密码，使用积分工具';
                            msgDiv.classList.remove('success-msg');
                        }
                    }, 4000);
                }
            }
        } catch (preErr) {
            console.error('[预检异常]', preErr);
        }
    }
    
    function displayStartupWarning(msg) {
        const msgDiv = document.getElementById('message');
        if (msgDiv && document.getElementById('loginArea').style.display !== 'none') {
            msgDiv.innerHTML = msg;
            msgDiv.classList.add('error-msg');
        }
    }

    // 页面加载完成
    window.addEventListener('DOMContentLoaded', () => {
        try {
            supabaseClient = initSupabaseClient();
            preflightConnection();
        } catch (e) {
            console.error(e);
        }
        // 回车登录
        const pwdInput = document.getElementById('password');
        const userInput = document.getElementById('username');
        const loginHandler = (e) => { if (e.key === 'Enter') login(); };
        if (pwdInput) pwdInput.addEventListener('keypress', loginHandler);
        if (userInput) userInput.addEventListener('keypress', loginHandler);
    });

    // 全局函数暴露
    window.login = login;
    window.useTool = useTool;
    window.logout = logout;
</script>
</body>
</html>
